<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Base styles for dark-theme industrial email */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #E5E7EB;
            background-color: #0B0E14;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #151921;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #232933;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .email-header {
            background: linear-gradient(135deg, #1A1F26 0%, #151921 100%);
            color: #ffffff;
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #232933;
        }
        .email-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #3498DB;
        }
        .email-body {
            padding: 35px;
        }
        .email-body h2 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .info-box {
            background-color: #0F131A;
            border: 1px solid #232933;
            padding: 20px;
            margin: 25px 0;
            border-radius: 8px;
        }
        .info-row {
            margin: 12px 0;
            font-size: 14px;
        }
        .info-label {
            font-weight: 700;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            display: inline-block;
            width: 140px;
        }
        .info-value {
            color: #F3F4F6;
            font-weight: 500;
        }
        .button {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(90deg, #2980B9 0%, #3498DB 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            margin: 25px 0;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        .severity-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .severity-CRITICAL { background-color: #7F1D1D; color: #FCA5A5; border: 1px solid #EF4444; }
        .severity-HIGH     { background-color: #7C2D12; color: #FDBA74; border: 1px solid #F97316; }
        .severity-MEDIUM   { background-color: #713F12; color: #FDE047; border: 1px solid #EAB308; }
        .severity-LOW      { background-color: #14532D; color: #86EFAC; border: 1px solid #22C55E; }
        
        .email-footer {
            background-color: #0F131A;
            padding: 25px;
            text-align: center;
            color: #6B7280;
            font-size: 11px;
            border-top: 1px solid #232933;
        }
        .email-footer a {
            color: #3498DB;
            text-decoration: none;
            font-weight: 600;
        }
        .brand-footer {
            margin-top: 15px;
            font-weight: 800;
            color: #374151;
            letter-spacing: 2px;
        }
        p { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <h1>🛡️ SafetyFirst HSE</h1>
        </div>

        <!-- Body -->
        <div class="email-body">
            {% block content %}
            <!-- Content -->
            {% endblock %}
        </div>

        <!-- Footer -->
        <div class="email-footer">
            <p>
                This is an automated governance notification from your HSE Management System.<br>
                Security & Compliance Enforcement Active.
            </p>
            <p>
                <a href="http://localhost:3000/incidents">Governance Dashboard</a> |
                <a href="http://localhost:3000/settings">User Preferences</a>
            </p>
            <div class="brand-footer">SAFETYFIRST HSE PRO</div>
            <p>© 2026 SafeCorp Industries. Confidential Information.</p>
        </div>
    </div>
</body>
</html>
